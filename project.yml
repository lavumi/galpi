name: Galpi
options:
  bundleIdPrefix: com.lavumi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.1"

packages:
  # 취소선 스타일 패치 때문에 벤더링한 사본을 쓴다. 원본 커밋과 패치 목록은 vendor/.../UPSTREAM.md 참고.
  SwiftStreamingMarkdown:
    path: vendor/SwiftStreamingMarkdown
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.9.0

settings:
  base:
    # Swift 6 툴체인, 언어 모드 5. 동시성 검사를 올리는 건 별도 작업으로 한다.
    SWIFT_VERSION: "5.0"

targets:
  Galpi:
    type: application
    platform: macOS
    sources:
      - Galpi
    dependencies:
      - package: SwiftStreamingMarkdown
      - package: GRDB
        product: GRDB
    info:
      path: Galpi/Info.plist
      properties:
        CFBundleDisplayName: 갈피
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        # 메뉴 바 전용 앱. Dock 표시는 설정에서 setActivationPolicy(.regular) 로 승격한다.
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lavumi.galpi
        # 개인 빌드이므로 임시 서명으로 로컬 실행만 한다. 배포 시 팀·공증을 별도로 설정한다.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # codex app-server 를 자식 프로세스로 띄우고 사용자의 ~/.codex 를 그대로 쓰므로 App Sandbox 는 켜지 않는다.
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - GalpiTests

  GalpiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GalpiTests
    dependencies:
      - target: Galpi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
